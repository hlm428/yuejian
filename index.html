<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月见公寓</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>月见公寓</h1>
    <div id="clock">--</div>
  </header>

  <main id="building" aria-label="公寓剖面图">
    <!-- 5F -->
    <section class="floor">
      <div class="room" id="room-501" data-room="501">
        <div class="window"></div>
        <div class="room-tag"><span class="no">501</span><span class="who">幸曦月</span></div>
        <div class="placeholder">幸曦月</div>
        <img class="portrait" id="img-501" src="assets/characters/xiyue_full.png" alt="幸曦月">
      </div>
    </section>

    <!-- 4F -->
    <section class="floor">
      <div class="room" id="room-401" data-room="401">
        <div class="window"></div>
        <div class="room-tag"><span class="no">401</span><span class="who">顾云笙</span></div>
        <div class="placeholder">顾云笙</div>
        <img class="portrait" id="img-401" src="assets/characters/yunsheng_full.png" alt="顾云笙">
      </div>
    </section>

    <!-- 3F：301 与 302 相邻 -->
    <section class="floor">
      <div class="room" id="room-301" data-room="301">
        <div class="window"></div>
        <div class="room-tag"><span class="no">301</span><span class="who">宋知夕</span></div>
        <div class="placeholder">宋知夕</div>
        <img class="portrait" id="img-301" src="assets/characters/zhixi_full.png" alt="宋知夕">
      </div>
      <div class="room" id="room-302" data-room="302">
        <div class="window"></div>
        <div class="room-tag"><span class="no">302</span><span class="who">你</span></div>
      </div>
    </section>

    <!-- 1F 便利店 -->
    <section class="floor">
      <div class="room room-store" id="room-store" data-room="store">
        <div class="shelf"></div>
        <div class="room-tag"><span class="no">1F</span><span class="who">便利店</span></div>
        <div class="store-state" id="store-state">--</div>
      </div>
    </section>

    <!-- B1 地下室 -->
    <section class="floor">
      <div class="room" id="room-b1" data-room="b1">
        <div class="room-tag"><span class="no">B1</span><span class="who">皇甫夜澜</span></div>
        <div class="placeholder">皇甫夜澜</div>
        <img class="portrait" id="img-b1" src="assets/characters/yelan_full.png" alt="皇甫夜澜">
        <div class="sleep-tip">睡觉中</div>
      </div>
    </section>
  </main>

  <footer id="hint">点房间互动 · 更多玩法施工中</footer>
  <div id="toast" role="status"></div>
</div>

<script src="data/lines_yunsheng.js"></script>
<script src="js/app.js"></script>
</body>
</html>
